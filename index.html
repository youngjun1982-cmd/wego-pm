<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>위고 프로젝트 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="위고 프로젝트">
<meta name="theme-color" content="#1b2286">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light;
 --bg:#eef2fb;--glow1:rgba(99,132,255,.28);--glow2:rgba(168,120,255,.22);--glow3:rgba(255,160,200,.18);
 --card:rgba(255,255,255,.72);--card-border:rgba(255,255,255,.9);--card-shadow:0 8px 30px rgba(50,70,140,.08);
 --surface:#ffffff;--surface2:#f3f5fb;--border:#e3e8f4;--text:#111a33;--text2:#55607a;--muted:#8a93ab;
 --accent:#3b6cf6;--accent2:#7c5cf6;--on-accent:#fff;--s1:#3b6cf6;--s2:#8b5cf6;--s3:#22b8cf;
 --good:#15803d;--good-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--info:#1d4ed8;--info-bg:#dbeafe;--crit:#b91c1c;--crit-bg:#fee2e2;--neutral:#4b5569;--neutral-bg:#e6eaf3;
 --tile1:linear-gradient(135deg,#dbe6ff,#c7d4ff);--tile2:linear-gradient(135deg,#d9fbe8,#bff1d6);--tile3:linear-gradient(135deg,#ffe3e3,#ffcfd6);--tile4:linear-gradient(135deg,#efe3ff,#dcd0ff);--tile5:linear-gradient(135deg,#fff1d6,#ffe2b3);
}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0a1020;--glow1:rgba(45,212,191,.16);--glow2:rgba(124,92,246,.2);--glow3:rgba(56,189,248,.1);
 --card:rgba(17,26,46,.78);--card-border:rgba(255,255,255,.07);--card-shadow:0 10px 36px rgba(0,0,0,.35);
 --surface:#131c31;--surface2:#1a2540;--border:rgba(255,255,255,.09);--text:#e8edf8;--text2:#aab4cc;--muted:#6f7a94;
 --accent:#2dd4bf;--accent2:#7c5cf6;--on-accent:#06110f;--s1:#2dd4bf;--s2:#8b5cf6;--s3:#38bdf8;
 --good:#34d399;--good-bg:rgba(52,211,153,.14);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);--info:#60a5fa;--info-bg:rgba(96,165,250,.14);--crit:#f87171;--crit-bg:rgba(248,113,113,.14);--neutral:#aab4cc;--neutral-bg:rgba(255,255,255,.08);
 --tile1:linear-gradient(135deg,rgba(45,212,191,.25),rgba(45,212,191,.08));--tile2:linear-gradient(135deg,rgba(52,211,153,.25),rgba(52,211,153,.08));--tile3:linear-gradient(135deg,rgba(248,113,113,.25),rgba(248,113,113,.08));--tile4:linear-gradient(135deg,rgba(139,92,246,.3),rgba(139,92,246,.1));--tile5:linear-gradient(135deg,rgba(251,191,36,.25),rgba(251,191,36,.08));
}
/* ===== Glass themes ===== */
:root[data-theme="glass"]{color-scheme:light;
 --bg:#e6dcff;
 --card:rgba(255,255,255,.34);--card-border:rgba(255,255,255,.85);--card-shadow:0 26px 50px rgba(90,70,170,.2),0 2px 6px rgba(90,70,170,.08),inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 30px rgba(255,255,255,.35);
 --edge:linear-gradient(135deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.25) 30%,rgba(110,200,255,.75) 55%,rgba(255,110,200,.85) 80%,rgba(255,190,120,.95) 100%);
 --surface:rgba(255,255,255,.58);--surface2:rgba(255,255,255,.42);--border:rgba(255,255,255,.8);--text:#1a1642;--text2:#4b4684;--muted:#7b76ad;
 --accent:#7c5cf6;--accent2:#ff5fae;--on-accent:#fff;--s1:#7c5cf6;--s2:#ff5fae;--s3:#38bdf8;
 --good:#0f8a5f;--good-bg:rgba(80,230,170,.32);--warn:#a85a00;--warn-bg:rgba(255,200,90,.4);--info:#1d4ed8;--info-bg:rgba(110,170,255,.35);--crit:#b3123f;--crit-bg:rgba(255,120,170,.32);--neutral:#4b4684;--neutral-bg:rgba(255,255,255,.5);
 --tile1:linear-gradient(145deg,#a78bff,#6c5cf6);--tile2:linear-gradient(145deg,#6cc2ff,#3b82f6);--tile3:linear-gradient(145deg,#ff9ad0,#ff5fae);--tile4:linear-gradient(145deg,#ffbe7a,#ff7a3d);--tile5:linear-gradient(145deg,#8be9ff,#22b8cf);
 --glow-a:rgba(124,92,246,.55);--glow-b:rgba(255,95,174,.45);
}
:root[data-theme="glass-dark"]{color-scheme:dark;
 --bg:#07061a;
 --card:rgba(255,255,255,.075);--card-border:rgba(255,255,255,.22);--card-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 40px rgba(120,100,255,.08);
 --edge:linear-gradient(135deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,.08) 30%,rgba(56,189,248,.8) 55%,rgba(255,95,174,.85) 80%,rgba(255,138,61,.9) 100%);
 --surface:rgba(255,255,255,.1);--surface2:rgba(255,255,255,.07);--border:rgba(255,255,255,.16);--text:#f4f2ff;--text2:#bdb7e6;--muted:#8781b4;
 --accent:#38bdf8;--accent2:#ff5fae;--on-accent:#06110f;--s1:#38bdf8;--s2:#a78bfa;--s3:#ff8a3d;
 --good:#4ade80;--good-bg:rgba(74,222,128,.18);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.18);--info:#60a5fa;--info-bg:rgba(96,165,250,.18);--crit:#fb7185;--crit-bg:rgba(251,113,133,.2);--neutral:#bdb7e6;--neutral-bg:rgba(255,255,255,.1);
 --tile1:linear-gradient(145deg,#a78bff,#6c5cf6);--tile2:linear-gradient(145deg,#5fd0ff,#2563eb);--tile3:linear-gradient(145deg,#ff8fcb,#ff3d9a);--tile4:linear-gradient(145deg,#ffb36b,#ff6a1f);--tile5:linear-gradient(145deg,#7ff0ff,#06b6d4);
 --glow-a:rgba(56,189,248,.7);--glow-b:rgba(255,95,174,.6);
}
:root[data-theme="glass"] body::before{background:linear-gradient(118deg,#ffd2c2 0%,#f1c4ff 26%,#c9ccff 52%,#b9e5ff 76%,#ffd9c9 100%)}
:root[data-theme="glass"] body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(560px 460px at 10% 15%,rgba(255,150,110,.7),transparent 70%),radial-gradient(680px 560px at 90% 10%,rgba(140,110,255,.7),transparent 70%),radial-gradient(620px 560px at 60% 100%,rgba(80,200,255,.6),transparent 70%),radial-gradient(420px 360px at 30% 85%,rgba(255,120,200,.5),transparent 70%)}
:root[data-theme="glass-dark"] body::before{background:radial-gradient(760px 620px at 85% 90%,rgba(255,120,50,.55),transparent 70%),radial-gradient(760px 640px at 50% 45%,rgba(124,92,246,.55),transparent 70%),radial-gradient(640px 520px at 8% 10%,rgba(56,189,248,.5),transparent 70%),radial-gradient(520px 420px at 15% 90%,rgba(255,95,174,.45),transparent 70%),#07061a}
:root[data-theme^="glass"] .card,:root[data-theme^="glass"] .side{backdrop-filter:blur(42px) saturate(1.6);-webkit-backdrop-filter:blur(42px) saturate(1.6);border:1px solid var(--card-border);position:relative;isolation:isolate}
:root[data-theme^="glass"] .card{border-radius:26px}
:root[data-theme^="glass"] .card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:-1;opacity:.9}
:root[data-theme^="glass"] .card::after{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);pointer-events:none;z-index:-1}
:root[data-theme^="glass"] .side{border-width:0 1px 0 0}
:root[data-theme^="glass"] .kpi .tile,:root[data-theme^="glass"] .card .ch .ic,:root[data-theme^="glass"] .list-row .av{color:#fff!important;border-radius:14px;box-shadow:0 12px 26px var(--glow-a),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(0,0,0,.12)}
:root[data-theme^="glass"] .kpi .tile{width:46px;height:46px}
:root[data-theme^="glass"] .btn,:root[data-theme^="glass"] .pill,:root[data-theme^="glass"] .seg,:root[data-theme^="glass"] .sub-tabs,:root[data-theme^="glass"] select,:root[data-theme^="glass"] input,:root[data-theme^="glass"] textarea{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:var(--card-border);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
:root[data-theme^="glass"] .btn.primary,:root[data-theme^="glass"] .sub-tabs button.on,:root[data-theme^="glass"] .nav.on{background:linear-gradient(135deg,#7c5cf6,#ff5fae 70%,#ff8a3d);color:#fff;box-shadow:0 10px 26px var(--glow-a),inset 0 1px 0 rgba(255,255,255,.45)}
:root[data-theme^="glass"] .greet h1 em{background-image:linear-gradient(90deg,#7c5cf6,#ff5fae,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="glass-dark"] .greet h1 em{background-image:linear-gradient(90deg,#38bdf8,#a78bfa,#ff5fae)}
:root[data-theme^="glass"] th{background:var(--surface2)}
:root[data-theme^="glass"] .modal{background:var(--card);backdrop-filter:blur(40px) saturate(1.5);-webkit-backdrop-filter:blur(40px) saturate(1.5);border-color:var(--card-border)}
:root[data-theme="glass"] .modal{background:rgba(255,255,255,.7)}
:root[data-theme^="glass"] .kpi.link:hover{transform:translateY(-4px) scale(1.01)}
:root[data-theme^="glass"] .hbar .t i,:root[data-theme^="glass"] .bar-h i{background:linear-gradient(90deg,#38bdf8,#7c5cf6,#ff5fae)}
:root[data-theme^="glass"] .stack{height:14px}
/* glass chart styling */
:root[data-theme^="glass"] .chart .grid line{stroke:rgba(255,255,255,.35)}
:root[data-theme="glass-dark"] .chart .grid line{stroke:rgba(255,255,255,.1)}
:root[data-theme^="glass"] .chart .glow{filter:drop-shadow(0 0 7px var(--glow-a)) drop-shadow(0 4px 10px var(--glow-b))}
:root[data-theme^="glass"] .chart .bar{stroke:rgba(255,255,255,.55);stroke-width:1}
:root[data-theme^="glass"] .tooltip{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:var(--card);border-color:var(--card-border)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 8% 0%,var(--glow1),transparent 70%),radial-gradient(700px 500px at 95% 10%,var(--glow2),transparent 70%),radial-gradient(600px 500px at 60% 100%,var(--glow3),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.layout{display:flex;min-height:100vh}
/* sidebar */
.side{width:236px;flex:none;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--card-border)}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.logo .mark{width:44px;height:44px;border-radius:13px;overflow:hidden;box-shadow:0 6px 16px rgba(27,34,134,.35);flex:none}.logo .mark svg{width:44px;height:44px;display:block}
.logo b{display:block;font-size:15px}.logo span{font-size:11px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:0;background:transparent;cursor:pointer;color:var(--text2);text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.on{background:linear-gradient(135deg,rgba(59,108,246,.16),rgba(124,92,246,.12));color:var(--accent);font-weight:600}
:root[data-theme="dark"] .nav.on{background:linear-gradient(135deg,rgba(45,212,191,.18),rgba(124,92,246,.14))}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--neutral-bg);color:var(--text2);padding:1px 8px;border-radius:999px}
.side .sec{font-size:11px;color:var(--muted);padding:14px 12px 4px;letter-spacing:.04em}
.side .bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 2px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* main */
.main{flex:1;min-width:0;padding:22px 28px 40px}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topline .greet{flex:1;min-width:200px}
.greet .hi{color:var(--text2);font-size:13px}
.greet h1{margin:2px 0 0;font-size:26px;letter-spacing:-.02em}
.greet h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.greet .sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.pill select{border:0;background:transparent;padding:0;font-weight:600}
.pill input{border:0;background:transparent;padding:0;min-width:180px;outline:none}
.pill svg{width:16px;height:16px;color:var(--muted)}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:transform .1s,box-shadow .15s}
.btn:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.btn svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(99,102,241,.3)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;min-width:0}
input[type=number]{text-align:right}
input[readonly]{background:var(--surface2)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--card-border);border-radius:18px;padding:18px 20px;box-shadow:var(--card-shadow);min-width:0}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .ch h3{margin:0;font-size:15px;flex:1}
.card .ch .ic{width:30px;height:30px;border-radius:9px;background:var(--tile1);display:grid;place-items:center;color:var(--accent)}
.card .ch .ic svg{width:16px;height:16px}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi.link{cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.kpi.link:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(50,50,140,.16)}
.kpi.link::after{content:"→";position:absolute;right:16px;top:14px;color:var(--muted);opacity:0;transition:opacity .15s}
.kpi.link:hover::after{opacity:1}
.kpi .tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.kpi .tile svg{width:20px;height:20px}
.kpi .l{color:var(--text2);font-size:13px}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:2px;padding:1px 7px;border-radius:999px;font-weight:600;font-size:12px}
.delta.up{background:var(--good-bg);color:var(--good)}.delta.down{background:var(--crit-bg);color:var(--crit)}.delta.flat{background:var(--neutral-bg);color:var(--neutral)}
.row2{grid-template-columns:3fr 2fr}.row3{grid-template-columns:1fr 1fr 1fr}.row21{grid-template-columns:2fr 1fr}
@media (max-width:1000px){.row2,.row3,.row21{grid-template-columns:1fr}}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;background:var(--surface2);position:sticky;top:0;z-index:1}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td.num,th.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--border);border-bottom:0;background:var(--surface2)}
tfoot tr:first-child td:first-child{border-radius:10px 0 0 0}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.badge.editable{cursor:pointer;padding-right:7px}.badge.editable em{font-style:normal;font-size:10px;opacity:.6;margin-left:1px}
.badge.editable:hover{box-shadow:0 0 0 2px var(--border);filter:brightness(1.05)}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:8px;min-width:220px;display:flex;flex-direction:column;gap:3px}
.pop .pop-t{font-size:11px;color:var(--muted);padding:2px 6px 4px}
.pop .pop-i{border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pop .pop-i:hover{background:var(--surface2)}.pop .pop-i.on{background:var(--surface2);outline:1px solid var(--border)}
.pop .pop-i .chk{margin-left:auto;font-size:12px;color:var(--accent)}
.pop .pop-c{display:flex;gap:6px;border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.pop .pop-c input{flex:1;min-width:0;padding:6px 8px}
:root[data-theme="glass"] .pop{background:rgba(255,255,255,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
:root[data-theme="glass-dark"] .pop{background:rgba(22,17,56,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
:root[data-theme$="dark"] .badge{filter:brightness(1.45) saturate(1.05)}
.pop-row{display:flex;align-items:center;gap:4px}.pop-row .pop-i{flex:1}
.pop-color{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:8px;display:grid;place-items:center}.pop-color:hover{background:var(--surface2)}
.pop-color i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--border)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 8px 34px}
.swatches button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatches button.on{border-color:var(--text)}
.swatches label{width:20px;height:20px;border-radius:50%;border:1px dashed var(--muted);display:grid;place-items:center;font-size:12px;color:var(--muted);cursor:pointer;overflow:hidden;position:relative}
.swatches label input{position:absolute;inset:0;opacity:0;cursor:pointer}
.neg{color:var(--crit)}.pos{color:var(--good)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tablewrap{overflow:auto;max-height:72vh;border-radius:14px}
.tablewrap table.list{table-layout:fixed}
table.list td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.list th{position:sticky;overflow:visible}
.rs{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3}
.rs::after{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:2px;border-radius:1px;background:transparent;transition:background .15s}
.rs:hover::after,.rs.on::after{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
.muted{color:var(--muted)}.small{font-size:12px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px}
.chart .grid line{stroke:var(--border)}
.chart .bar{cursor:pointer;transition:opacity .15s}.chart .bar:hover{opacity:.75}
.chart .xh{stroke:var(--accent);stroke-dasharray:3 3;opacity:0}

.donut-list .r .n{flex:1}.donut-list .r .p{color:var(--muted);font-size:12px}
.hbar{display:flex;flex-direction:column;gap:10px}
.hbar .r{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;font-size:13px}
.hbar .t{height:8px;background:var(--neutral-bg);border-radius:4px;overflow:hidden}

function delta(cur, prev, suffix=''){
  if(!prev) return `<span class="delta flat">이전 연도 없음</span>`;
  const r = (cur-prev)/Math.abs(prev)*100; const cls = r>0.5?'up':r<-0.5?'down':'flat';
  return `<span class="delta ${cls}">${r>0?'↑':r<0?'↓':'·'} ${Math.abs(r).toFixed(1)}%</span><span>${suffix}</span>`;
}
function greeting(){ const h=new Date().getHours(); return h<12?'좋은 아침입니다':h<18?'좋은 오후입니다':'좋은 저녁입니다'; }

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on', b.dataset.nav===(ui.tab==='list'&&ui.mode==='unpaid'?'unpaid':ui.tab)));
  $('#navDetail').style.display = ui.detailId ? '' : 'none'; $('#mnavDetail').style.display = ui.detailId ? '' : 'none';
  $('#cntAll').textContent = filtered().length; const un = filtered().filter(p=>outstanding(p)>0).length; $('#cntUnpaid').textContent = un||'';
  const ys = years(); if(ui.year!=='all' && !ys.includes(+ui.year)) ui.year = ys.length? String(ys[0]) : 'all';
  const app = $('#app');
  if(ui.tab==='dash') app.innerHTML = renderDash();
  else if(ui.tab==='list') app.innerHTML = renderList();
  else app.innerHTML = renderDetail();
  bindCharts();
}
function topline(title, sub, extra=''){
  const ys = years();
  return `<div class="topline">
    <div class="greet"><div class="hi">${greeting()} 👋</div><h1>${title}</h1><div class="sub">${sub}</div></div>
    ${extra}
    <label class="pill">${ICONS.cal}<select id="yearSel"><option value="all" ${ui.year==='all'?'selected':''}>전체 연도</option>${ys.map(y=>`<option value="${y}" ${ui.year===String(y)?'selected':''}>${y}년</option>`).join('')}</select></label>
    <button class="btn primary" id="btnNew">${ICONS.plus}새 프로젝트</button>
  </div>`;
}

function renderDash(){
  const all = filtered();
  const ps = all.filter(p=>!isPayout(p));            // 매출 건
  const payouts = all.filter(isPayout);               // 지급 건
  const amt = ps.reduce((a,p)=>a+(p.amount||0),0);
  const tot = ps.reduce((a,p)=>a+total(p),0);
  const rec = ps.reduce((a,p)=>a+received(p),0);
  const out = ps.reduce((a,p)=>a+outstanding(p),0);
  const lost = ps.filter(p=>p.status==='떼임').reduce((a,p)=>a+total(p),0);
  const exp = all.reduce((a,p)=>a+expSum(p),0) + payouts.reduce((a,p)=>a+Math.max(0,(p.amount||0)-expSum(p)),0);

  ps.forEach(p=>{ if(p.month>=1&&p.month<=12){ months[p.month-1].v += p.amount||0; months[p.month-1].n++; } });
  const yl = years().slice().reverse().map(y=>{ const q=state.projects.filter(p=>p.year===y && !isPayout(p)); return {l:String(y), v:q.reduce((a,p)=>a+(p.amount||0),0), n:q.length}; });

    <div class="card kpi link" data-act="goStatus" data-status="입금완료" title="입금완료 프로젝트 목록으로"><div class="tile" style="background:var(--tile2);color:var(--good)">${ICONS.check}</div><div class="l">입금 완료</div><div class="v">${won(rec)}원</div><div class="d"><span class="delta ${rec/tot>0.7?'up':'flat'}">${tot?Math.round(rec/tot*100):0}% 수금</span><span>합계 ${won(tot)}원 기준</span></div></div>
    <div class="card kpi link" data-act="goMode" data-mode="unpaid" title="미수금 목록으로"><div class="tile" style="background:var(--tile3);color:var(--crit)">${ICONS.alert}</div><div class="l">미수금 (부가세 포함)</div><div class="v ${out?'neg':''}">${won(out)}원</div><div class="d"><span class="delta ${out?'down':'up'}">${unpaid.length}건</span><span>${lost?`떼임 ${won(lost)}원`:'떼인 금액 없음'}</span></div></div>

    </div>
    <div class="card"><div class="ch"><span class="ic">${ICONS.chart}</span><h3>연도별 매출 비교</h3></div>${barChart(yl.map(x=>({l:x.l,v:x.v,t:`<b>${x.l}년</b>${x.n}건 · ${won(x.v)}원`})),'yr',230,360)}</div>
    <div class="card"><div class="ch"><span class="ic">${ICONS.clock}</span><h3>최근 프로젝트</h3><button class="btn sm ghost" data-act="goList">전체 보기</button></div>
      ${recent.map(p=>`<div class="list-row" data-act="open" data-id="${p.id}"><div class="av">${esc((p.client||p.name).slice(0,1))}</div><div class="t"><b>${esc(p.name)}${kindTag(p)}</b><span>${dateStr(p)} · ${esc(p.client||'거래처 미지정')}</span></div><div style="text-align:right"><div class="amt ${isPayout(p)?'neg':''}">${isPayout(p)?'−':''}${won(p.amount)}</div>${badge(p.status)}</div></div>`).join('')||'<div class="empty">프로젝트 없음</div>'}

/* charts */
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v/p; const n = f<=1?1:f<=2?2:f<=2.5?2.5:f<=4?4:f<=5?5:f<=8?8:10; return n*p; }
function areaChart(data, id, h=230){
  const W=680, H=h, padL=56, padR=14, padT=16, padB=30;
  const nice = niceMax(Math.max(1,...data.map(d=>d.v)));
  const iw=W-padL-padR, ih=H-padT-padB, n=data.length;
  const x = i => padL + (n>1? iw*i/(n-1) : iw/2);
  const y = v => padT+ih - ih*(v/nice);
  const pts = data.map((d,i)=>[x(i),y(d.v)]);
  let line=''; pts.forEach(([px,py],i)=>{ if(i===0){ line=`M${px},${py}`; return; } const [ax,ay]=pts[i-1]; const cx=(ax+px)/2; line+=` C${cx},${ay} ${cx},${py} ${px},${py}`; });
  const area = line + ` L${pts[n-1][0]},${padT+ih} L${pts[0][0]},${padT+ih} Z`;
  let g=''; for(let i=0;i<=4;i++){ const yy=padT+ih-ih*i/4; g+=`<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}"/><text x="${padL-8}" y="${yy+4}" text-anchor="end">${manwon(nice*i/4)}</text>`; }
  const labels = data.map((d,i)=> (n>14 && i%2) ? '' : `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`).join('');
  const G = isGlass();
  const lineStops = G ? '<stop offset="0" stop-color="#38bdf8"/><stop offset=".45" stop-color="#7c5cf6"/><stop offset=".8" stop-color="#ff5fae"/><stop offset="1" stop-color="#ff8a3d"/>' : '<stop offset="0" style="stop-color:var(--s1)"/><stop offset="1" style="stop-color:var(--s2)"/>';
  const areaStops = G ? '<stop offset="0" stop-color="#7c5cf6" stop-opacity=".55"/><stop offset=".6" stop-color="#ff5fae" stop-opacity=".18"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>' : '<stop offset="0" style="stop-color:var(--s1);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--s2);stop-opacity:.02"/>';
  return `<svg class="chart area" viewBox="0 0 ${W} ${H}" id="${id}" data-pts='${JSON.stringify(pts.map((p,i)=>[p[0],p[1],data[i].t]))}' data-base="${padT+ih}">
    <defs><linearGradient id="${id}-g" x1="0" x2="0" y1="0" y2="1">${areaStops}</linearGradient>
    <linearGradient id="${id}-l" x1="0" x2="1" y1="0" y2="0">${lineStops}</linearGradient></defs>
    <g class="grid">${g}</g>
    <path d="${area}" fill="url(#${id}-g)"/><path class="${G?'glow':''}" d="${line}" fill="none" stroke="url(#${id}-l)" stroke-width="${G?4:2.5}" stroke-linecap="round"/>
    ${G?`<path d="${line}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.2" stroke-linecap="round" transform="translate(0,-1.5)"/>`:''}
    <line class="xh" x1="0" x2="0" y1="${padT}" y2="${padT+ih}" stroke-width="1"/>
    <circle class="dot ${G?'glow':''}" r="${G?7:5}" fill="${G?'#fff':'var(--s1)'}" stroke="${G?'#7c5cf6':'var(--surface)'}" stroke-width="${G?3:2}" style="opacity:0"/>
    ${labels}<rect class="hit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
}
function barChart(data, id, h=220, W=640){
  const H=h, padL=50, padR=10, padT=14, padB=28;
  const nice = niceMax(Math.max(1,...data.map(d=>d.v)));
  const iw=W-padL-padR, ih=H-padT-padB, bw=iw/data.length;
  let g=''; for(let i=0;i<=4;i++){ const y=padT+ih-ih*i/4; g+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/><text x="${padL-6}" y="${y+4}" text-anchor="end">${manwon(nice*i/4)}</text>`; }
  const G = isGlass();
  const bars = data.map((d,i)=>{ const x=padL+bw*i+bw*(G?0.3:0.22), w=bw*(G?0.4:0.56), bh=ih*(d.v/nice), y=padT+ih-bh, r=G?Math.min(w/2,bh/2):Math.min(5,w/2,bh);
    const path = bh>0 ? (G ? `M${x},${padT+ih-r} V${y+r} a${r},${r} 0 0 1 ${r},-${r} H${x+w-r} a${r},${r} 0 0 1 ${r},${r} V${padT+ih-r} a${r},${r} 0 0 1 -${r},${r} H${x+r} a${r},${r} 0 0 1 -${r},-${r} Z` : `M${x},${padT+ih} V${y+r} a${r},${r} 0 0 1 ${r},-${r} H${x+w-r} a${r},${r} 0 0 1 ${r},${r} V${padT+ih} Z`) : '';
    return `<path class="bar ${G?'glow':''}" d="${path}" fill="url(#${id}-bg)" data-tip="${esc(d.t)}"/><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`; }).join('');
  const stops = G ? '<stop offset="0" stop-color="#7ff0ff"/><stop offset=".5" stop-color="#7c5cf6"/><stop offset="1" stop-color="#ff5fae"/>' : '<stop offset="0" style="stop-color:var(--s1)"/><stop offset="1" style="stop-color:var(--s2);stop-opacity:.75"/>';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${id}-bg" x1="0" x2="0" y1="0" y2="1">${stops}</linearGradient></defs><g class="grid">${g}</g>${bars}</svg>`;
}
function groupedChart(cats){
  const W=640, H=240, padL=52, padR=10, padT=14, padB=44;
  const nice=niceMax(Math.max(1,...cats.flatMap(c=>[c.a,c.b])));
  const iw=W-padL-padR, ih=H-padT-padB, gw=iw/cats.length;
  let g=''; for(let i=0;i<=4;i++){ const y=padT+ih-ih*i/4; g+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/><text x="${padL-6}" y="${y+4}" text-anchor="end">${manwon(nice*i/4)}</text>`; }
  const bars = cats.map((c,i)=>{ const bw=gw*0.3, x0=padL+gw*i+gw*0.18;
    const mk=(x,v,col,tip)=>{ const bh=ih*(v/nice), y=padT+ih-bh, r=Math.min(4,bw/2,bh); return bh>0?`<path class="bar" fill="${col}" data-tip="${esc(tip)}" d="M${x},${padT+ih} V${y+r} a${r},${r} 0 0 1 ${r},-${r} H${x+bw-r} a${r},${r} 0 0 1 ${r},${r} V${padT+ih} Z"/>`:''; };
    const lab = c.l.length>7? c.l.slice(0,7)+'…':c.l;
    return mk(x0,c.a,'var(--s1)',`<b>${c.l}</b>예산 ${won(c.a)}원`) + mk(x0+bw+2,c.b,'var(--s2)',`<b>${c.l}</b>지출 ${won(c.b)}원`) + `<text x="${x0+bw+1}" y="${H-24}" text-anchor="middle">${esc(lab)}</text>`; }).join('');
  return `<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--s1)"></i>실비 예산</span><span><i style="background:var(--s2)"></i>실제 지출</span></div><svg class="chart" viewBox="0 0 ${W} ${H}"><g class="grid">${g}</g>${bars}</svg>`;
}
function donut(segs, center){
  const sum = segs.reduce((a,s)=>a+s.v,0)||1; const R=60, C=2*Math.PI*R; let off=0;
  const G = isGlass();
  const arcs = segs.map(s=>{ const len=C*s.v/sum; const el=`<circle class="${G?'glow':''}" r="${R}" cx="75" cy="75" fill="none" stroke="${s.c}" stroke-width="${G?22:18}" stroke-dasharray="${Math.max(0,len-2)} ${C-Math.max(0,len-2)+2}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)" data-tip="<b>${esc(s.l)}</b>${s.n}건 · ${won(s.v)}원 · ${Math.round(s.v/sum*100)}%" class="bar"/>`; off+=len; return el; }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 150 150" class="chart" style="overflow:visible">${G?`<circle r="${R}" cx="75" cy="75" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="22"/>`:''}${arcs}<text x="75" y="72" text-anchor="middle" style="font-size:18px;font-weight:800;fill:var(--text)">${esc(center)}</text><text x="75" y="90" text-anchor="middle">프로젝트</text></svg>
  <div class="donut-list">${segs.map(s=>`<div class="r" data-act="goList" data-status="${esc(s.l)}"><i style="background:${s.c}"></i><span class="n">${esc(s.l)}</span><span class="p">${s.n}건 · ${Math.round(s.v/sum*100)}%</span><b>${manwon(s.v)}</b></div>`).join('')}</div></div>`;
}
function bindCharts(){
  const tip = $('#tip');
  const show=(html,e)=>{ tip.style.display='block'; tip.innerHTML=html; const r=tip.getBoundingClientRect(); tip.style.left=Math.min(window.innerWidth-r.width-8, e.clientX+14)+'px'; tip.style.top=(e.clientY-r.height-12 > 0 ? e.clientY-r.height-12 : e.clientY+14)+'px'; };
  document.querySelectorAll('[data-tip]').forEach(el=>{ el.addEventListener('mousemove', e=>show(el.dataset.tip,e)); el.addEventListener('mouseleave', ()=> tip.style.display='none'); });
  document.querySelectorAll('svg.area').forEach(svg=>{
    const pts = JSON.parse(svg.dataset.pts); const xh=svg.querySelector('.xh'), dot=svg.querySelector('.dot'); const hit=svg.querySelector('.hit');
    hit.addEventListener('mousemove', e=>{ const r=svg.getBoundingClientRect(); const sx=(e.clientX-r.left)*(svg.viewBox.baseVal.width/r.width);
      let best=0; pts.forEach((p,i)=>{ if(Math.abs(p[0]-sx)<Math.abs(pts[best][0]-sx)) best=i; }); const p=pts[best];
      xh.setAttribute('x1',p[0]); xh.setAttribute('x2',p[0]); xh.style.opacity=1; dot.setAttribute('cx',p[0]); dot.setAttribute('cy',p[1]); dot.style.opacity=1; show(p[2],e); });
    hit.addEventListener('mouseleave', ()=>{ xh.style.opacity=0; dot.style.opacity=0; tip.style.display='none'; });
  });
}

function dExpenses(p){
  const SORTS=[['date-desc','날짜 ↓'],['date-asc','날짜 ↑'],['item','항목 가나다'],['cat','분류'],['amount-desc','금액 ↓'],['amount-asc','금액 ↑']];
  const cmp = (a,b)=>{ const k=ui.expSort;
    if(k==='date-desc') return b.e.date.localeCompare(a.e.date) || b.i-a.i;
    if(k==='date-asc') return a.e.date.localeCompare(b.e.date) || a.i-b.i;
    if(k==='item') return (a.e.item||'').localeCompare(b.e.item||'','ko') || b.e.date.localeCompare(a.e.date);
    if(k==='cat') return (a.e.category||'ㅎㅎㅎ').localeCompare(b.e.category||'ㅎㅎㅎ','ko') || b.e.date.localeCompare(a.e.date);
    if(k==='amount-desc') return (b.e.amount||0)-(a.e.amount||0);

function openForm(title, fields, values, onSubmit){

    else if(f.type==='textarea') inp = `<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
    else if(f.type==='number') inp = `<input type="number" name="${f.k}" value="${v}" step="${f.step||1}" ${f.attr||''}>`;
    else if(f.type==='date') inp = `<input type="date" name="${f.k}" value="${esc(v)}">`;
    else inp = `<input type="text" name="${f.k}" value="${esc(v)}" ${f.list?`list="${f.list}"`:''} ${f.attr||''}>`;

const TAX_MODES = [['none','단가 그대로'],['vat','부가세 10% 추가 (×1.1)'],['wh33','원천징수 3.3% 공제 (×0.967)'],['manual','직접 입력']];

function attachTaxCalc(form, amountField, word){
  const u = form.querySelector('[name=unitPrice]'), a = form.querySelector(`[name=${amountField}]`), m = form.querySelector('[name=taxMode]');
  const hint = document.createElement('span'); hint.className='small muted'; hint.style.marginTop='2px'; a.parentElement.appendChild(hint);

    else { a.readOnly = false; a.style.opacity = 1; }
    hint.textContent = mode==='vat' ? `단가 ${won(unit)} + 부가세 10% = ${won(taxCalc(unit,'vat'))}원` : mode==='wh33' ? `단가 ${won(unit)} − 3.3% 원천징수 ${won(unit - taxCalc(unit,'wh33'))} = ${won(taxCalc(unit,'wh33'))}원` : mode==='none' ? `단가와 같은 금액을 ${word}` : `${word}액을 직접 입력하세요`; };
  u.addEventListener('input', recalc); m.addEventListener('change', recalc);
  a.addEventListener('input', ()=>{ if(taxCode(m.value)!=='manual'){ m.value = taxLabel('manual'); recalc(); } });
  recalc();
}

  document.querySelectorAll('#styleSeg button').forEach(b=>b.classList.toggle('on', b.dataset.s===style));

(function(){ let t=pref.theme||null; if(!t && !NATIVE){ try{ t = localStorage.getItem(KEY+'-theme'); }catch(e){} } if(!t) t = matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'; applyTheme(t); })();

const sync = { cfg: pref.cloud||null, session: pref.cloudSession||null, lastSync: pref.cloudLastSync||null, dirty:false, pushTimer:null, busy:false, status:'off', msg:'' };
function syncPersist(){ pref.cloud=sync.cfg; pref.cloudSession=sync.session; pref.cloudLastSync=sync.lastSync; savePref(); }
function sbUrl(){ return (sync.cfg&&sync.cfg.url||'').trim().replace(/\/+$/,'').replace(/\/(rest|auth|storage)\/v1$/,'').replace(/\/+$/,''); }
function sbHeaders(auth=true){ const h={'apikey':sync.cfg.key,'Content-Type':'application/json','Accept':'application/json'}; if(auth&&sync.session) h['Authorization']='Bearer '+sync.session.access_token; return h; }
async function sbAuth(path, body){
  const r = await fetch(sbUrl()+'/auth/v1/'+path, {method:'POST', headers: sbHeaders(false), body: JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.msg||j.error_description||j.error||j.message||('HTTP '+r.status));
  return j;
}
function setSession(j){ if(!j||!j.access_token||!j.user) return false; sync.session={access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Math.floor(Date.now()/1000)+(j.expires_in||3600), user:{id:j.user.id, email:j.user.email}}; syncPersist(); return true; }
async function ensureToken(force){
  if(!sync.session) throw new Error('로그인이 필요합니다');
  if(force || Date.now()/1000 > (sync.session.expires_at||0) - 90){ const j = await sbAuth('token?grant_type=refresh_token', {refresh_token: sync.session.refresh_token}); if(!setSession(j)) throw new Error('세션 갱신 실패'); }
}
async function sbRest(method, path, body, extra={}, retry=true){
  await ensureToken();
  const r = await fetch(sbUrl()+'/rest/v1/'+path, {method, headers: Object.assign(sbHeaders(), extra), body: body?JSON.stringify(body):undefined});
  if(r.status===401 && retry){ await ensureToken(true); return sbRest(method, path, body, extra, false); }
  const txt = await r.text();
  if(!r.ok){ let m=txt; try{ const j=JSON.parse(txt); m=j.message||j.hint||j.msg||txt; }catch(e){} throw new Error((m||('HTTP '+r.status)).slice(0,200)); }
  return txt ? JSON.parse(txt) : null;
}
async function pullRemote(){ const rows = await sbRest('GET', `pm_data?select=data,updated_at&user_id=eq.${sync.session.user.id}`); return rows && rows[0] || null; }
async function pushRemote(){
  if(!state.savedAt) state.savedAt = new Date().toISOString();
  await sbRest('POST', 'pm_data', [{user_id: sync.session.user.id, data: state, updated_at: state.savedAt}], {'Prefer':'resolution=merge-duplicates,return=minimal'});
  sync.dirty=false; sync.lastSync=state.savedAt; syncPersist(); setSyncStatus('synced');
}
function adoptRemote(r){ state = r.data; if(!state.nextId) state.nextId = Math.max(0,...state.projects.map(p=>p.id))+1; state.savedAt = state.savedAt || r.updated_at; persistLocal(); sync.dirty=false; sync.lastSync=r.updated_at; syncPersist(); if(!$('#modalBg').classList.contains('on')) render(); }
function schedulePush(){ clearTimeout(sync.pushTimer); setSyncStatus('pending'); sync.pushTimer=setTimeout(()=>syncTick(), 1500); }
async function syncTick(manual){
  if(!sync.session || !sync.cfg) return;
  if(sync.busy){ if(manual) return; sync.pushTimer=setTimeout(()=>syncTick(),2000); return; }
  if(!navigator.onLine){ setSyncStatus('offline'); return; }
  sync.busy=true;
  try{
    const r = await pullRemote();
    if(r && r.updated_at > (state.savedAt||'') && !$('#modalBg').classList.contains('on')){ adoptRemote(r); }
    else if(sync.dirty || !r || (r.updated_at < (state.savedAt||'')) ){ await pushRemote(); }
    else setSyncStatus('synced');
  }catch(e){ setSyncStatus('error', e.message); }
  finally{ sync.busy=false; }
}
function setSyncStatus(s, msg){ sync.status=s; sync.msg=msg||''; const el=$('#syncMsg'), dot=$('#cloudDot');
  const tm = sync.lastSync ? new Date(sync.lastSync).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '';
  const text = s==='synced'?`☁ 동기화됨 ${tm}`:s==='pending'?'☁ 동기화 대기 중…':s==='offline'?`☁ 오프라인 · 연결되면 동기화`:s==='error'?`☁ 오류: ${msg}`:'☁ 클라우드 미연결';
  if(el) el.textContent = text; if(dot){ dot.textContent = s==='synced'?'●':s==='error'?'!':s==='off'?'':'…'; dot.style.color = s==='synced'?'var(--good)':s==='error'?'var(--crit)':'var(--muted)'; } }
async function cloudLogin(email, password, signup){
  const j = await sbAuth(signup ? 'signup' : 'token?grant_type=password', {email, password});
  if(!setSession(j)){ if(signup) throw new Error('가입은 되었지만 이메일 확인이 필요합니다. 메일의 확인 링크를 누른 뒤 로그인하세요. (Supabase Auth 설정에서 "Confirm email"을 끄면 바로 로그인됩니다)'); throw new Error('로그인 응답에 세션이 없습니다'); }
  const r = await pullRemote();
  if(!r){ await pushRemote(); return '이 기기의 데이터를 클라우드에 올렸습니다.'; }
  if(r.updated_at > (state.savedAt||'')){
    if(!state.savedAt || confirm(`클라우드에 ${new Date(r.updated_at).toLocaleString('ko-KR')} 저장된 데이터가 있습니다.\n이 기기의 데이터를 클라우드 데이터로 교체할까요?\n\n취소: 이 기기의 데이터를 클라우드에 올립니다 (클라우드 데이터는 덮어씌워집니다).`)){ adoptRemote(r); return '클라우드 데이터를 가져왔습니다.'; }
  }
  await pushRemote(); return '이 기기의 데이터를 클라우드에 올렸습니다.';
}
function cloudModal(){
  const bg=$('#modalBg'), m=$('#modal'); const cfg=sync.cfg||DEFAULT_CLOUD;
  const connected = !!sync.session;
  m.innerHTML = `<h2>☁ 클라우드 동기화</h2>
    <div class="small muted" style="margin:-8px 0 12px">맥 앱 · 휴대폰 웹앱 · 브라우저 어디서 입력해도 같은 데이터를 봅니다. Supabase(무료)에 저장됩니다.</div>
    ${connected ? `
      <div class="card" style="padding:12px 14px;margin-bottom:12px"><b>연결됨</b> · ${esc(sync.session.user.email)}<div class="small muted" id="cmStatus">${esc($('#syncMsg').textContent)}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="cmSync">지금 동기화</button><button class="btn" id="cmLogout">로그아웃</button><button class="btn danger" id="cmReset">연동 해제</button></div>
      <div class="small muted" style="margin-top:12px">서버: ${esc(cfg.url)}</div>`
    : `
      <div class="form">
        <label class="full">Supabase 프로젝트 URL<input type="text" id="cmUrl" placeholder="https://xxxx.supabase.co" value="${esc(cfg.url)}"></label>
        <label class="full">anon public 키<input type="text" id="cmKey" placeholder="eyJ..." value="${esc(cfg.key)}"></label>
        <label>이메일<input type="text" id="cmEmail" autocomplete="username" placeholder="you@example.com"></label>
        <label>비밀번호 (6자 이상)<input type="password" id="cmPw" autocomplete="current-password"></label>
      </div>
      <div class="small muted" style="margin-top:8px">서버 주소와 키는 위고디자인 프로젝트로 미리 채워져 있습니다. 처음이면 "회원가입", 다른 기기에서 가입했으면 "로그인".</div>
      <div id="cmErr" class="small" style="color:var(--crit);margin-top:8px"></div>
      <div class="actions"><button class="btn" id="mcancel">닫기</button><button class="btn" id="cmSignup">회원가입</button><button class="btn primary" id="cmLogin">로그인</button></div>`}
    ${connected?'<div class="actions"><button class="btn" id="mcancel">닫기</button></div>':''}`;
  bg.classList.add('on');
  $('#mcancel').onclick = closeModal;
  if(connected){
    $('#cmSync').onclick = async ()=>{ $('#cmSync').textContent='동기화 중…'; sync.dirty = sync.dirty || false; await syncTick(true); $('#cmStatus').textContent=$('#syncMsg').textContent; $('#cmSync').textContent='지금 동기화'; };
    $('#cmLogout').onclick = ()=>{ sync.session=null; syncPersist(); setSyncStatus('off'); cloudModal(); };
    $('#cmReset').onclick = ()=>{ if(confirm('이 기기의 클라우드 설정(서버·로그인)을 지웁니다. 데이터는 지워지지 않습니다.')){ sync.session=null; sync.cfg=null; sync.lastSync=null; syncPersist(); setSyncStatus('off'); cloudModal(); } };
  } else {
    const go = async (signup)=>{ const url=$('#cmUrl').value.trim(), key=$('#cmKey').value.trim(), email=$('#cmEmail').value.trim(), pw=$('#cmPw').value;
      const err=$('#cmErr'); err.textContent='';
      if(!/^https?:\/\//.test(url) || !key){ err.textContent='Supabase URL과 anon 키를 입력하세요.'; return; }
      if(!email || pw.length<6){ err.textContent='이메일과 6자 이상 비밀번호를 입력하세요.'; return; }
      sync.cfg={url,key}; syncPersist();
      const b=signup?$('#cmSignup'):$('#cmLogin'); const old=b.textContent; b.textContent='연결 중…'; b.disabled=true;
      try{ const msg = await cloudLogin(email, pw, signup); setSyncStatus('synced'); cloudModal(); const st=$('#cmStatus'); if(st) st.textContent = msg + ' · ' + $('#syncMsg').textContent; }
      catch(e){ err.textContent = '실패: ' + e.message; b.textContent=old; b.disabled=false; } };
    $('#cmLogin').onclick=()=>go(false); $('#cmSignup').onclick=()=>go(true);
    $('#cmPw').addEventListener('keydown', e=>{ if(e.key==='Enter') go(false); });
  }
}

$('#fileIn').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d||!Array.isArray(d.projects)) throw 0; if(confirm(`백업 파일의 프로젝트 ${d.projects.length}건으로 현재 데이터를 교체할까요?`)){ state=d; state.nextId = state.nextId || Math.max(0,...state.projects.map(p=>p.id))+1; ui.detailId=null; ui.tab='dash'; save(); render(); } }catch(err){ alert('올바른 백업 파일이 아닙니다'); } e.target.value=''; }; rd.readAsText(f); });
$('#btnCsv').onclick = ()=>{ const rows=[['연도','월','일','품명','거래처','금액','부가세','합계','지급여부','입금','미수','지출','비고']];
  filtered().sort((a,b)=>dateKey(a)-dateKey(b)).forEach(p=>rows.push([p.year,p.month,p.day,p.name,p.client,p.amount,p.vat,total(p),p.status,received(p),outstanding(p),expSum(p),p.note]));
  download(`프로젝트목록_${ui.year==='all'?'전체':ui.year}.csv`, toCsv(rows), 'text/csv'); };
function toCsv(rows){ return '﻿'+rows.map(r=>r.map(c=>{ c=String(c??''); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\r\n'); }
function download(name, content, type){ if(NATIVE){ nativePost({type:'download', name, content}); return; } const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type:type+';charset=utf-8'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

$('#app').addEventListener('input', e=>{ if(e.target.id==='q'){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); } });
$('#app').addEventListener('change', e=>{ if(e.target.id==='statusSel'){ ui.status=e.target.value; render(); } if(e.target.id==='yearSel'){ ui.year=e.target.value; render(); } });
$('#app').addEventListener('click', e=>{
  if(e.target.closest('#btnNew')){ projectForm(null); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act; const id = Number(el.dataset.id); const i = el.dataset.i!=null ? Number(el.dataset.i) : null;
  const p = state.projects.find(x=>x.id===(ui.tab==='detail'?ui.detailId:id));
  const pr = state.projects.find(x=>x.id===id);
  switch(act){
    case 'sort': ui.sort = ui.sort.key===el.dataset.key ? {key:el.dataset.key, dir:-ui.sort.dir} : {key:el.dataset.key, dir: ['name','client','status'].includes(el.dataset.key)?1:-1}; render(); break;
    case 'goList': ui.tab='list'; ui.mode=''; ui.status=el.dataset.status||''; render(); window.scrollTo(0,0); break;
    case 'goStatus': ui.tab='list'; ui.mode=''; ui.status=el.dataset.status||''; ui.sort={key:'date',dir:-1}; render(); window.scrollTo(0,0); break;
    case 'goUnpaid': ui.tab='list'; ui.mode='unpaid'; ui.status=''; render(); window.scrollTo(0,0); break;
    case 'goMode': ui.tab='list'; ui.mode=el.dataset.mode||''; ui.status=''; if(ui.mode==='expense') ui.sort={key:'exp',dir:-1}; else if(ui.tab!=='list') ui.sort={key:'date',dir:-1}; render(); window.scrollTo(0,0); break;
    case 'open': ui.detailId=id; ui.tab='detail'; ui.dtab='summary'; render(); window.scrollTo(0,0); break;
    case 'back': ui.tab='list'; render(); break;
    case 'print': if(NATIVE) nativePost({type:'print'}); else window.print(); break;
    case 'dtab': ui.dtab=el.dataset.k; render(); break;
    case 'statusPop': e.stopPropagation(); statusPopover(el, pr); break;
    case 'noop': e.stopPropagation(); break;
    case 'resetCols': delete pref.colW; savePref(); render(); break;
    case 'edit': e.stopPropagation(); projectForm(pr); break;
    case 'dup': e.stopPropagation(); projectForm(pr, true); break;
    case 'expSort': ui.expSort=el.dataset.k; render(); break;
    case 'expGroupToggle': ui.expGroup=!ui.expGroup; render(); break;
    case 'estItemDup': estItemForm(p,i,true); break;
    case 'budDup': budgetForm(p,i,true); break;
    case 'expDup': expenseForm(p,i,true); break;
    case 'payDup': paymentForm(p,i,true); break;
    case 'del': e.stopPropagation(); if(confirm(`'${pr.name}' 프로젝트를 삭제할까요? (견적·지출 기록도 함께 삭제됩니다)`)){ state.projects = state.projects.filter(x=>x!==pr); if(ui.detailId===id){ui.detailId=null; ui.tab='list';} save(); render(); } break;
    case 'estNew': case 'estMeta': estMetaForm(p); break;
    case 'estItemNew': estItemForm(p,null); break;
    case 'estItemEdit': estItemForm(p,i); break;
    case 'estItemDel': p.estimate.items.splice(i,1); save(); render(); break;
    case 'estApply': { const c=estCalc(p.estimate); const amt = Math.round(c.trunc/1.1); if(confirm(`금액(공급가)을 ${won(amt)}원, 부가세를 ${won(c.trunc-amt)}원으로 설정할까요?`)){ p.amount=amt; p.vat=c.trunc-amt; save(); render(); } } break;
    case 'estCsv': { const e2=p.estimate, c=estCalc(e2); const rows=[['구분','항목','수량','단위','단가','금액','비고']]; e2.items.forEach(it=>rows.push([it.group,it.name,it.qty,it.unit,it.unitPrice,(it.qty||0)*(it.unitPrice||0),it.note])); rows.push(['','소계','','','',c.sub,''],['','일반관리비','','','',c.oh,''],['','이윤','','','',c.pf,''],['','부가세','','','',c.vat,''],['','합계','','','',c.tot,'']); download(`견적서_${p.name}.csv`,toCsv(rows),'text/csv'); } break;
    case 'budNew': budgetForm(p,null); break;
    case 'budEdit': budgetForm(p,i); break;
    case 'budDel': p.budget.splice(i,1); save(); render(); break;
    case 'expNew': expenseForm(p,null); break;
    case 'expEdit': expenseForm(p,i); break;
    case 'expDel': if(confirm('이 지출 기록을 삭제할까요?')){ p.expenses.splice(i,1); save(); render(); } break;
    case 'expCsv': { const rows=[['날짜','항목','분류','단가','금액','비고']]; p.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>rows.push([x.date,x.item,x.category,x.unitPrice,x.amount,x.note])); rows.push(['','합계','','',expSum(p),'']); download(`지출내역_${p.name}.csv`,toCsv(rows),'text/csv'); } break;
    case 'payNew': paymentForm(p,null); break;
    case 'payEdit': paymentForm(p,i); break;
    case 'payDel': p.payments.splice(i,1); save(); render(); break;
  }
});
let rz=null;
$('#app').addEventListener('mousedown', e=>{
  const h=e.target.closest('.rs'); if(!h) return;
  e.preventDefault(); e.stopPropagation();
  const table=h.closest('table'); const col=table.querySelector(`col[data-col="${h.dataset.col}"]`);
  rz={x:e.clientX, key:h.dataset.col, col, w:parseFloat(col.style.width)||100, table, tw:parseFloat(table.style.width)||table.offsetWidth, h};
  h.classList.add('on'); document.body.classList.add('resizing');
});
document.addEventListener('mousemove', e=>{ if(!rz) return; const w=Math.max(56, Math.round(rz.w + (e.clientX-rz.x))); rz.col.style.width=w+'px'; rz.table.style.width=(rz.tw + (w-rz.w))+'px'; });
document.addEventListener('mouseup', ()=>{ if(!rz) return; pref.colW=pref.colW||{}; pref.colW[rz.key]=parseFloat(rz.col.style.width); savePref(); rz.h.classList.remove('on'); document.body.classList.remove('resizing'); const had=!!rz; rz=null; if(had && !document.querySelector('[data-act=resetCols]')) render(); });
window.addEventListener('beforeunload', ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} });
render(); booted=true; setSyncStatus(sync.session?'pending':'off'); if(sync.session) setTimeout(()=>syncTick(), 800);
if(state.savedAt) document.getElementById('saveMsg').textContent = '마지막 저장 ' + new Date(state.savedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
else if(NATIVE) document.getElementById('saveMsg').textContent = '입력하면 앱 데이터 폴더에 자동 저장됩니다';
